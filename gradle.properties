# Gradle Daemon Memory (3GB)
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Kotlin Daemon Memory (4GB) - Essential for large Jetpack Compose IR lowering
kotlin.daemon.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m

# Android & Kotlin Settings
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=36

# Build Optimizations
org.gradle.parallel=true
kotlin.incremental=true
org.gradle.caching=true
