# Gradle Daemon Memory (2.5GB)
org.gradle.jvmargs=-Xmx2560m -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Kotlin Daemon Memory (3GB) - Fits safely within 12GB container alongside Gradle & D8
kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m

# Android & Kotlin Settings
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=36

# Build Optimizations
org.gradle.parallel=true
kotlin.incremental=true
org.gradle.caching=true
