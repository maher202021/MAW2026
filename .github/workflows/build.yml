name: Build Android Release APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Generate Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Ensure google-services.json
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        mkdir -p app
        if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
          echo "Processing GOOGLE_SERVICES_JSON_BASE64 secret..."
          if echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json.decoded 2>/dev/null && [ -s app/google-services.json.decoded ]; then
            mv app/google-services.json.decoded app/google-services.json
            echo "Successfully decoded base64 secret."
          elif echo "$GOOGLE_SERVICES_JSON_BASE64" | grep -q "project_info"; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" > app/google-services.json
            echo "Used secret directly as plain JSON."
          fi
        fi
        if [ ! -f "app/google-services.json" ] || [ ! -s "app/google-services.json" ]; then
          echo "Writing default app/google-services.json..."
          cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "954106721012",
    "project_id": "serviseyem",
    "storage_bucket": "serviseyem.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:954106721012:android:5fa5e385532b08d5c0e4a1",
        "android_client_info": {
          "package_name": "com.serviseyem"
        }
      },
      "oauth_client": [],
      "api_key": [{"current_key": "AIzaSyBq2SEhBADFGVF4sDyV3sC_t2HqQ1m8lC0"}],
      "services": {"appinvite_service": {"other_platform_oauth_client": []}}
    }
  ],
  "configuration_version": "1"
}
EOF
        fi
        echo "Verifying app/google-services.json:"
        head -n 5 app/google-services.json

    - name: Setup Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding KEYSTORE_BASE64..."
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > my-release-key.jks 2>/dev/null || true
        fi
        if [ ! -f my-release-key.jks ] || [ ! -s my-release-key.jks ]; then
          echo "Generating default signing keystore..."
          keytool -genkeypair -v -keystore my-release-key.jks -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        cp my-release-key.jks debug.keystore || true

    - name: Build Release APK
      env:
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx3072m -XX:+UseParallelGC' -Dkotlin.daemon.jvmargs='-Xmx4096m -XX:+UseParallelGC'"
      run: |
        ./gradlew :app:assembleRelease --no-daemon --stacktrace

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Serviseyem-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
