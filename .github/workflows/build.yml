name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Generate Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Ensure google-services.json
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        mkdir -p app
        python3 -c "
        import os, base64

        sec = os.environ.get('GOOGLE_SERVICES_JSON_BASE64', '').strip()
        if sec:
            print('Decoding google-services.json from GitHub Secret...')
            try:
                with open('app/google-services.json', 'wb') as f:
                    f.write(base64.b64decode(sec))
                print('Successfully decoded secret into app/google-services.json')
            except Exception as e:
                print('Error decoding secret:', e)

        if os.path.exists('app/google-services.json') and os.path.getsize('app/google-services.json') > 10:
            print('Valid app/google-services.json confirmed in repository.')
        else:
            print('Creating fallback app/google-services.json...')
            fallback_json = '''{
  \"project_info\": {
    \"project_number\": \"248399837437\",
    \"project_id\": \"gen-lang-client-0971808563\",
    \"storage_bucket\": \"gen-lang-client-0971808563.firebasestorage.app\"
  },
  \"client\": [
    {
      \"client_info\": {
        \"mobilesdk_app_id\": \"1:248399837437:android:e98f77cc6c7b1df6e7e694\",
        \"android_client_info\": {
          \"package_name\": \"com.serviseyem\"
        }
      },
      \"oauth_client\": [
        {
          \"client_id\": \"248399837437-lce4n82nqd2hgr94ucs1opol8d7q0hgn.apps.googleusercontent.com\",
          \"client_type\": 1,
          \"android_info\": {
            \"package_name\": \"com.serviseyem\",
            \"certificate_hash\": \"2ac9a4ad2af4eb227fbf540875a9d9b882fc86be\"
          }
        },
        {
          \"client_id\": \"248399837437-051107tco5jtmgfdqmk12ee7hh7hc07n.apps.googleusercontent.com\",
          \"client_type\": 3
        }
      ],
      \"api_key\": [
        {
          \"current_key\": \"AIzaSyC6IR5Gpb_RmAeONYQ1r93G6FMUgdFSRL8\"
        }
      ],
      \"services\": {
        \"appinvite_service\": {
          \"other_platform_oauth_client\": [
            {
              \"client_id\": \"248399837437-051107tco5jtmgfdqmk12ee7hh7hc07n.apps.googleusercontent.com\",
              \"client_type\": 3
            }
          ]
        }
      }
    }
  ],
  \"configuration_version\": \"1\"
}'''
            with open('app/google-services.json', 'w', encoding='utf-8') as f:
                f.write(fallback_json)
            print('Fallback app/google-services.json created successfully.')
        "

    - name: Setup Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding release keystore from GitHub Secret..."
          echo "$KEYSTORE_BASE64" | base64 -d > my-release-key.jks
        elif [ -f debug.keystore.base64 ]; then
          echo "Decoding debug.keystore.base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        if [ ! -f debug.keystore ] && [ ! -f my-release-key.jks ]; then
          echo "Generating fallback debug keystore..."
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Release APK Only
      env:
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx3072m -XX:+UseParallelGC' -Dkotlin.daemon.jvmargs='-Xmx4096m -XX:+UseParallelGC'"
      run: |
        ./gradlew :app:assembleRelease --no-daemon --stacktrace

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Serviseyem-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
