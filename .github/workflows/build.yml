name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Generate Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Ensure google-services.json
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        mkdir -p app
        if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
          echo "Decoding google-services.json from GitHub Secret..."
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
        fi
        if [ ! -f "app/google-services.json" ]; then
          echo "Error: app/google-services.json is missing!"
          exit 1
        fi
        echo "app/google-services.json verified successfully."

    - name: Setup Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding release keystore from GitHub Secret..."
          echo "$KEYSTORE_BASE64" | base64 -d > my-release-key.jks
        elif [ -f debug.keystore.base64 ]; then
          echo "Decoding debug.keystore.base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        if [ ! -f debug.keystore ] && [ ! -f my-release-key.jks ]; then
          echo "Generating fallback debug keystore..."
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Release APK Only
      env:
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx3072m -XX:+UseParallelGC' -Dkotlin.daemon.jvmargs='-Xmx4096m -XX:+UseParallelGC'"
      run: |
        ./gradlew :app:assembleRelease --no-daemon --stacktrace

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Serviseyem-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
