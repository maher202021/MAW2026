name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Ensure Gradle Wrapper 9.3.1
      run: |
        gradle wrapper --gradle-version 9.3.1
        chmod +x gradlew

    - name: Create google-services.json
      run: |
        mkdir -p app
        cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "954106721012",
            "project_id": "serviseyem",
            "storage_bucket": "serviseyem.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:954106721012:android:5fa5e385532b08d5c0e4a1",
                "android_client_info": {
                  "package_name": "com.serviseyem"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyBq2SEhBADFGVF4sDyV3sC_t2HqQ1m8lC0"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF

    - name: Setup Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding user release keystore from secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > my-release-key.jks
        elif [ -f debug.keystore.base64 ]; then
          echo "Decoding debug.keystore.base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        if [ ! -f debug.keystore ] && [ ! -f my-release-key.jks ]; then
          echo "Generating fallback keystore..."
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Release APK
      env:
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: ./gradlew :app:assembleRelease --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: app/build/outputs/apk/release/*.apk
